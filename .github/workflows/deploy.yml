name: Build and Deploy Fun Bot

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'openspec/**'
      - '.qwen/**'
      - '.agents/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build and test
        run: mvn clean verify

      - name: Deploy to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

          cat > fun.env <<'ENVFILE'
          BOT_TOKEN=${{ secrets.TOKEN_TG_FUN_BOT }}
          BOT_DB_URL=${{ secrets.DB_ADDR_FUN_BOT }}
          BOT_DB_USER=${{ secrets.DB_USER_FUN_BOT }}
          BOT_DB_PASSWORD=${{ secrets.DB_PASS_FUN_BOT }}
          BOT_OWNER_CHAT_ID=${{ secrets.FUN_OWNER_CHAT_ID }}
          FUN_RESOURCES_PATH=${{ secrets.FUN_RESOURCES_PATH }}
          BOT_PROXY_TYPE=${{ secrets.BOT_PROXY_TYPE }}
          BOT_PROXY_HOST=${{ secrets.BOT_PROXY_HOST }}
          BOT_PROXY_PORT=${{ secrets.BOT_PROXY_PORT }}
          BOT_PROXY_USER=${{ secrets.BOT_PROXY_USER }}
          BOT_PROXY_PASS=${{ secrets.BOT_PROXY_PASS }}
          ENVFILE

          scp fun.env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/fun.env
          scp target/fun-telegram-bot-1.0.jar ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/fun-telegram-bot-1.0.jar
          scp deploy/fun-telegram-bot.service ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:/tmp/fun-telegram-bot.service
          rm -f fun.env

          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo -n install -m 600 -o root -g root /tmp/fun.env /etc/telegram-bot/fun.env
            sudo -n install -m 644 /tmp/fun-telegram-bot-1.0.jar /usr/bin/tg_bot_fun/fun-telegram-bot-1.0.jar
            sudo -n install -m 644 /tmp/fun-telegram-bot.service /etc/systemd/system/fun-telegram-bot.service
            sudo -n systemctl daemon-reload
            sudo -n systemctl enable fun-telegram-bot
            sudo -n systemctl restart fun-telegram-bot
            sleep 20
            journalctl -u fun-telegram-bot --no-pager -n 20
            sudo -n systemctl is-active fun-telegram-bot
            rm -f /tmp/fun.env /tmp/fun-telegram-bot-1.0.jar /tmp/fun-telegram-bot.service
          EOF
